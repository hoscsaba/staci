name: Build platform binaries

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

# Superseded branch/PR builds need not consume another runner-hour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            parallel: 4
          - name: macOS
            os: macos-latest
            parallel: 2
          - name: Windows x64
            os: windows-latest
            parallel: 4

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache libsuitesparse-dev libhdf5-dev libpagmo-dev libeigen3-dev libigraph-dev nlohmann-json3-dev

      - name: Install dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install ccache suite-sparse hdf5 pagmo eigen igraph nlohmann-json

      - name: Restore compiler cache
        if: runner.os != 'Windows'
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare Windows binary cache
        if: runner.os == 'Windows'
        id: vcpkg
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:RUNNER_TEMP 'staci-vcpkg-binaries'
          New-Item -ItemType Directory -Force -Path $cachePath | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$cachePath,readwrite" >> $env:GITHUB_ENV
          "cache-path=$cachePath" >> $env:GITHUB_OUTPUT
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Restore Windows binary cache
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache-path }}
          key: vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg.outputs.revision }}-
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install suitesparse-umfpack:x64-windows hdf5:x64-windows pagmo2:x64-windows eigen3:x64-windows igraph:x64-windows nlohmann-json:x64-windows

      # Save immediately, even if a subsequent application test fails.
      # Always run vcpkg install above: vcpkg validates package ABI hashes.
      - name: Save Windows binary cache
        if: runner.os == 'Windows'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.vcpkg.outputs.cache-path }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Identify EPANET cache environment
        id: epanet-environment
        shell: bash
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore EPANET reference cache
        id: epanet-cache
        uses: actions/cache/restore@v6
        with:
          path: .epanet-reference
          key: epanet-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.epanet-environment.outputs.image }}-${{ hashFiles('tests/setup_epanet_reference.py') }}

      - name: Build and validate pinned EPANET reference
        run: python tests/setup_epanet_reference.py --build-root .epanet-reference --jobs ${{ matrix.parallel }} --cmake-cache .epanet-reference/reference.cmake

      - name: Save EPANET reference cache
        if: steps.epanet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .epanet-reference
          key: ${{ steps.epanet-cache.outputs.cache-primary-key }}

      - name: Configure on Linux or macOS
        if: runner.os != 'Windows'
        run: cmake -S . -B build -C .epanet-reference/reference.cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build -C .epanet-reference/reference.cmake
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}

      - name: Report compiler cache statistics
        if: runner.os != 'Windows'
        run: ccache --show-stats

      - name: Save compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Test hydraulics and flushing
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit "${{ github.workspace }}/build/ctest-results.xml"

      - name: Require all EPANET reference tests to pass
        run: python tests/check_ci_test_results.py build/ctest-results.xml

      - name: Upload numerical test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/ctest-results.xml
            build/public-network-reference-tests/report.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Install to package directory
        run: cmake --install build --config Release --prefix package

      - name: Include Windows runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Copy-Item
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll"
          "package/bin/"

      - name: Smoke-test executable on Linux or macOS
        if: runner.os != 'Windows'
        run: ./package/bin/staci -l tests/anytown_1med.spr

      - name: Smoke-test executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\package\bin\staci.exe -l tests\anytown_1med.spr

      - name: Include binary distribution notes
        shell: bash
        run: cp dist/README.md package/README.md

      - name: Create Linux or macOS archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact_file="staci-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -C package -czf "$artifact_file" .
          echo "ARTIFACT_FILE=$artifact_file" >> "$GITHUB_ENV"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactFile = "staci-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path package\* -DestinationPath $artifactFile
          "ARTIFACT_FILE=$artifactFile" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload executable bundle
        uses: actions/upload-artifact@v7
        with:
          name: staci-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.ARTIFACT_FILE }}
          if-no-files-found: error
          archive: false
